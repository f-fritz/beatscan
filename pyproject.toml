[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beatscan"
version = "0.1.0"
description = "Count beats per loop in VJ video clips"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
plots = ["matplotlib"]
test = ["pytest"]
notebook = ["matplotlib", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
beatscan = "beatscan.cli:main"
beatscan-explain = "beatscan.explain:main"

[tool.setuptools]
packages = ["beatscan"]
